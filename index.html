<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="terminal">
  <header><span class="dots">● ● ●</span><span>task-manager.py</span><span class="local">● LOCAL</span></header>
  <section id="screen">
    <div>Welcome to the Task Manager!</div>
    <div class="muted">Type <span class="green">HELP</span> to see the list of commands.</div>
    <div id="output"></div>
    <form id="form"><span class="green">&gt;</span><input id="cmd" autofocus autocomplete="off" placeholder="Enter command..."></form>
  </section>
  <footer>CREATE · LIST · UPDATE · DELETE · DONE · SEARCH · HISTORY · HELP · EXIT</footer>
</div>

<div id="modal" class="hide"><div class="box"><div class="head"><span id="title"></span><button onclick="closeModal()">×</button></div><div id="body"></div></div></div>
<script src="app.js"></script>
</body>
</html>
